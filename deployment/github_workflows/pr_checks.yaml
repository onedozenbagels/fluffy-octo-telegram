name: PR Checks & Golden Dataset Evaluation Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'tests/**'
      - 'deployment/**'
      - 'uv.lock'

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.WIF_POOL_ID }}/providers/${{ secrets.WIF_PROVIDER_ID }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
          create_credentials_file: true
          project_id: ${{ vars.CICD_PROJECT_ID }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra lint

      - name: Run Ruff linter
        run: uv run ruff check --no-cache app tests

      - name: Run unit tests
        run: uv run pytest tests/unit

      - name: Run integration tests
        env:
          GOOGLE_GENAI_USE_VERTEXAI: 'true'
          GOOGLE_GENAI_USE_ENTERPRISE: 'true'
          GOOGLE_CLOUD_PROJECT: ${{ vars.CICD_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: global
        run: uv run pytest tests/integration/test_agent.py

      - name: Run Golden Dataset Evaluation (Vertex AI Evaluation Service / LLM-as-Judge)
        env:
          GOOGLE_GENAI_USE_VERTEXAI: 'true'
          GOOGLE_GENAI_USE_ENTERPRISE: 'true'
          GOOGLE_CLOUD_PROJECT: ${{ vars.CICD_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: global
        run: |
          uvx google-agents-cli@1.9.0 eval run
          uv run python -c '
          import glob, json, sys
          files = sorted(glob.glob("artifacts/grade_results/results_*.json"))
          assert files, "No evaluation results produced!"
          data = json.load(open(files[-1]))
          score = data["summary_metrics"][0]["mean_score"]
          print(f"Golden Dataset Mean Score: {score}/5.0")
          assert score >= 4.0, f"Golden dataset evaluation gate failed: {score} < 4.0"
          '
