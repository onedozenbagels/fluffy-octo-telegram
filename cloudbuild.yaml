# Continuous Integration & Continuous Deployment (CI/CD) Pipeline for Cloud Build
# Automatically runs linting, unit/integration tests, and Golden Dataset Evaluation
# (Vertex AI Evaluation Service / LLM-as-judge) as a mandatory release gate before
# building the container and deploying to Google Cloud Run.

steps:
  # Step 1: Lint & Unit/Integration Test Gate
  - name: "ghcr.io/astral-sh/uv:python3.12-bookworm-slim"
    id: "unit-and-lint-checks"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        uv sync --locked --extra dev --extra lint
        uv run ruff check --no-cache app tests
        uv run pytest tests/unit

  # Step 2: Golden Dataset Evaluation Gate (Vertex AI GenAI Evaluation)
  # Deployment is blocked if mean custom_response_quality score < 4.0 / 5.0
  - name: "ghcr.io/astral-sh/uv:python3.12-bookworm-slim"
    id: "golden-dataset-evaluation-gate"
    waitFor: ["unit-and-lint-checks"]
    entrypoint: "bash"
    env:
      - "GOOGLE_GENAI_USE_VERTEXAI=true"
      - "GOOGLE_GENAI_USE_ENTERPRISE=true"
      - "GOOGLE_CLOUD_PROJECT=${PROJECT_ID}"
      - "GOOGLE_CLOUD_LOCATION=global"
    args:
      - "-c"
      - |
        set -euo pipefail
        uv tool install google-agents-cli
        export PATH="/root/.local/bin:$$PATH"
        agents-cli eval run
        uv run python -c '
        import glob, json, sys
        files = sorted(glob.glob("artifacts/grade_results/results_*.json"))
        if not files:
            sys.exit("No evaluation results found!")
        data = json.load(open(files[-1]))
        mean_score = data["summary_metrics"][0]["mean_score"]
        print(f"Golden Dataset Mean Score: {mean_score}/5.0")
        if mean_score < 4.0:
            sys.exit(f"Evaluation gate failed: {mean_score} < 4.0")
        '

  # Step 3: Build Multi-Stage Container Image
  - name: "gcr.io/cloud-builders/docker"
    id: "build-container-image"
    waitFor: ["golden-dataset-evaluation-gate"]
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/meal-recipe-agent:${SHORT_SHA}"
      - "."

  # Step 4: Push Container Image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    id: "push-container-image"
    waitFor: ["build-container-image"]
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/meal-recipe-agent:${SHORT_SHA}"

  # Step 5: Serverless Deployment to Google Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: "deploy-to-cloud-run"
    waitFor: ["push-container-image"]
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "meal-recipe-agent"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/meal-recipe-agent:${SHORT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--no-allow-unauthenticated"
      - "--set-env-vars=GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=global,GOOGLE_GENAI_USE_VERTEXAI=true"

substitutions:
  _REGION: "us-central1"
  _ARTIFACT_REGISTRY_REPO: "meal-recipe-agent-repo"

options:
  logging: CLOUD_LOGGING_ONLY
